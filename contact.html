<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form</title>
    <link rel="stylesheet" href="./css/cstyle.css">
    <script>
    function nxt(){
        window.location.assign("homepage.html");
    }
    </script>

</head>
<body>
    <div class="contact-container">
        <form action="https://api.web3forms.com/submit" method="POST" class="contact-left">
            <div class="contact-left-title">
                <h2>Get in touch</h2>
                <hr>
            </div>
            <input type="hidden" name="access_key" value="e0219614-d5b1-4f66-921c-002e5a99efc1">
            <input type="text" name="name" placeholder="Name" class="contact-inputs" required>
            <input type="email" name="email" placeholder="Email-ID" class="contact-inputs" required>
            <textarea name="message" placeholder="Type your message here..." class="contact-inputs" required></textarea>
            <button type="submit">submit <img src="img/right-arrow-alt-regular-24.png"></button>
            <button class="left-corner-button" onclick="nxt()">Home</button>
        </form>
        <div class="contact-right">
            <img src="./img/bride3.png" >
        </div>
    </div>
</body>
</html>
